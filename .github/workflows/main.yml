name: Deploy to GitHub Pages

# main ブランチへ push されるたびに、ビルドして GitHub Pages へ自動デプロイする
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: GitHub Pages の設定を取得
        id: pages
        uses: actions/configure-pages@v5

      - name: ビルド（GitHub Pages用のbaseパスを設定）
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Pages用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
